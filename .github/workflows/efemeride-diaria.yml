name: Efemèride diària

on:
  schedule:
    # 03:17 UTC (no en hora rodona): les execucions a les 00:00, 06:00, etc.
    # tenen molta cua a GitHub i sovint es descarten del tot, no només es
    # retarden. Un minut "no rodó" dins una franja de poc trànsit redueix
    # el risc que l'esdeveniment es perdi (com va passar el 27/08).
    - cron: "17 3 * * *"
  workflow_dispatch: {} # permet executar-lo manualment des de la pestanya "Actions"
permissions:
  contents: write

jobs:
  generar-efemeride:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositori
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generar l'efemèride del dia
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generar-efemeride.mjs

      - name: Reconstruir header/footer i arxiu
        run: node scripts/build.mjs

      - name: Desar els canvis al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/efemerides.json efemerides/ es/ index.html avis-legal.html sitemap.xml
          if git diff --staged --quiet; then
            echo "Sense canvis a desar."
          else
            git commit -m "Efemèride diària $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
