name: Reconstruir web

on:
  push:
    branches: [main]
    paths:
      - "partials/**"
      - "index.html"
      - "avis-legal.html"
      - "efemerides/_template.html"
      - "data/efemerides.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Reconstruir header/footer i arxiu
        run: node scripts/build.mjs

      - name: Desar els canvis al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Sense canvis a desar."
          else
            git commit -m "Rebuild automàtic"
            git push
          fi
